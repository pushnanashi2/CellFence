name: CellFence Check
description: Run CellFence repository governance checks.
inputs:
  manifest:
    description: Path to the CellFence manifest.
    required: false
    default: cellfence.manifest.json
  baseline:
    description: Optional baseline path for ratchet checks.
    required: false
    default: ""
  evidence:
    description: Optional runtime resource evidence JSON path.
    required: false
    default: ""
  version:
    description: Published CellFence CLI version to run. Pin to an exact version (e.g. 0.2.1) for required checks; the action defaults to a fixed release instead of the moving "latest" tag so a malicious or accidental publish cannot replace the binary under your workflows.
    required: false
    default: 0.2.1
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CELLFENCE_ACTION_MANIFEST: ${{ inputs.manifest }}
        CELLFENCE_ACTION_BASELINE: ${{ inputs.baseline }}
        CELLFENCE_ACTION_EVIDENCE: ${{ inputs.evidence }}
        CELLFENCE_ACTION_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # H-7 (0.3.0): pin the CLI to the version baked into the action so
        # "npx --yes cellfence@latest" cannot swap the binary out from
        # under a required check. Operators can still override the input.
        cli_version="${CELLFENCE_ACTION_VERSION:-}"
        if [ -z "${cli_version}" ]; then
          cli_version="0.2.1"
        fi
        cli_package="cellfence@${cli_version}"
        # H-7 (0.3.0): bash 3.2 (the macOS default) treats an unset or
        # empty array expansion under `set -u` differently from bash
        # 4+. Branch on the boolean instead of building an array so the
        # action runs identically on every GitHub-hosted runner.
        if [ -n "${CELLFENCE_ACTION_BASELINE}" ]; then
          if [ -n "${CELLFENCE_ACTION_EVIDENCE}" ]; then
            npx --yes "${cli_package}" baseline check --manifest "${CELLFENCE_ACTION_MANIFEST}" --baseline "${CELLFENCE_ACTION_BASELINE}" --evidence "${CELLFENCE_ACTION_EVIDENCE}"
          else
            npx --yes "${cli_package}" baseline check --manifest "${CELLFENCE_ACTION_MANIFEST}" --baseline "${CELLFENCE_ACTION_BASELINE}"
          fi
        else
          if [ -n "${CELLFENCE_ACTION_EVIDENCE}" ]; then
            npx --yes "${cli_package}" check --manifest "${CELLFENCE_ACTION_MANIFEST}" --evidence "${CELLFENCE_ACTION_EVIDENCE}"
          else
            npx --yes "${cli_package}" check --manifest "${CELLFENCE_ACTION_MANIFEST}"
          fi
        fi
