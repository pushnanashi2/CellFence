name: Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: |
          CELLFENCE_BASELINE_ED25519_PUBLIC_KEY='-----BEGIN PUBLIC KEY-----
          MCowBQYDK2VwAyEA1wyt/sB+0pJOhuw6dFnKaOIxRBNoDvx6talMmGsuISs=
          -----END PUBLIC KEY-----' npm run cellfence:self-check
      - run: npm run pack:smoke
      - run: npm run provenance:scan
      - run: npm run release:verify
