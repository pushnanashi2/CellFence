name: CellFence CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cellfence-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - run: npm run security:redos

  external-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build --silent
      - name: Run TypeScript resolution oracle
        run: node scripts/resolution-oracle-conformance.mjs
      - name: Run Python resolution oracle
        if: always()
        run: node scripts/python-resolution-oracle-conformance.mjs
      - name: Run SARIF official-schema oracle
        if: always()
        run: node scripts/sarif-oracle-conformance.mjs --root fixtures/invalid/private-cross-cell-import
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: external-oracle-reports-${{ github.run_attempt }}
          path: reports/*-oracle-conformance.json
          if-no-files-found: error

  cross-platform-smoke:
    name: cross-platform smoke (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify acceptance record artifact
        run: |
          mkdir -p reports/acceptance
          node packages/cli/dist/index.js check --root fixtures/valid/public-import --json --evidence-graph reports/acceptance/evidence-graph.json --acceptance-record reports/acceptance/record.json > reports/acceptance/check-result.json
          node scripts/acceptance-record-verify.mjs --record reports/acceptance/record.json --graph reports/acceptance/evidence-graph.json --out reports/acceptance/verify-report.json
      - name: Smoke test bundled baseline gate action
        run: |
          set +e
          output="$(node packages/github-action-baseline-gate/dist/index.js 2>&1)"
          status="$?"
          set -e
          if [ "$status" -ne 1 ]; then
            echo "$output"
            exit 1
          fi
          if ! echo "$output" | grep -F "requires a pull_request event" >/dev/null; then
            echo "$output"
            exit 1
          fi
      - run: git diff --exit-code -- packages/github-action-baseline-gate/dist/index.js

  self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: |
          CELLFENCE_BASELINE_ED25519_PUBLIC_KEY='-----BEGIN PUBLIC KEY-----
          MCowBQYDK2VwAyEA1wyt/sB+0pJOhuw6dFnKaOIxRBNoDvx6talMmGsuISs=
          -----END PUBLIC KEY-----' npm run cellfence:self-check

  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run provenance:scan

  release-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run release:verify

  scale-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run benchmark:scale

  pack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run pack:smoke

  ci-counts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Count CI violations by category
        env:
          CELLFENCE_BASELINE_ED25519_PUBLIC_KEY: |-
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEA1wyt/sB+0pJOhuw6dFnKaOIxRBNoDvx6talMmGsuISs=
            -----END PUBLIC KEY-----
        run: npm run ci:count
      - name: Summarize CI violation counts
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const p = "tmp/ci-counts/summary.json";
            if (!fs.existsSync(p)) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "## CI Violation Counts\n\nsummary.json was not produced.\n");
              process.exit(0);
            }
            const s = JSON.parse(fs.readFileSync(p, "utf8"));
            const rows = Object.entries(s.results).map(([name, result]) => {
              const count = result.errors ?? result.failures ?? result.findings ?? result.uncovered?.total ?? result.exitCode;
              return `| ${name} | ${result.exitCode} | ${count} |`;
            });
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
              "## CI Violation Counts",
              "",
              "| category | exitCode | count |",
              "|---|---:|---:|",
              ...rows,
              ""
            ].join("\n"));
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ci-counts
          path: tmp/ci-counts

  mutation-changed:
    name: mutation changed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            reports/mutation/incremental
            .git/cellfence-cache/changed-base
          key: mutation-${{ runner.os }}-pr-${{ github.event.pull_request.number }}-${{ hashFiles('package-lock.json', 'stryker.conf.mjs', 'stryker.changed.conf.mjs', 'scripts/mutation-*.mjs') }}
          restore-keys: |
            mutation-${{ runner.os }}-pr-${{ github.event.pull_request.number }}-
      - run: npm ci
      - name: Run mutation testing for changed scopes
        env:
          CELLFENCE_MUTATION_BASE: ${{ github.event.pull_request.base.sha }}
          CELLFENCE_MUTATION_CHANGED_JOBS: "3"
        run: npm run mutation:changed -- --base "$CELLFENCE_MUTATION_BASE" --head HEAD
      - name: Summarize changed mutation results
        if: always()
        run: node scripts/mutation-step-summary.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-changed-${{ github.event.pull_request.number }}
          path: reports/mutation/changed
          if-no-files-found: warn
