name: Full Mutation Audit

on:
  workflow_call:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - id: matrix
        name: Build authoritative mutation matrix
        shell: bash
        run: echo "matrix=$(npm run --silent mutation:matrix)" >> "$GITHUB_OUTPUT"

  audit:
    name: mutation audit (${{ matrix.id }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Record mutation audit intent
        env:
          CELLFENCE_MUTATION_AUDIT_SCOPE: ${{ matrix.id }}
        run: |
          mkdir -p reports/mutation/changed
          node - <<'NODE'
          const fs = require("fs");
          const intent = {
            schemaVersion: "cellfence.mutation-audit-intent.v1",
            scopeId: process.env.CELLFENCE_MUTATION_AUDIT_SCOPE,
            sha: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            workflow: process.env.GITHUB_WORKFLOW,
          };
          fs.writeFileSync("reports/mutation/changed/audit-intent.json", `${JSON.stringify(intent, null, 2)}\n`);
          NODE
      - run: npm ci
      - name: Run one authoritative mutation scope without cache
        run: npm run mutation:changed -- --scope "${{ matrix.id }}" --force --no-incremental
      - name: Summarize authoritative mutation results
        if: always()
        run: node scripts/mutation-step-summary.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-audit-${{ matrix.id }}-${{ github.run_attempt }}
          path: reports/mutation/changed
          if-no-files-found: warn
